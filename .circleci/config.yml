---
version: 2

references:
  filter_all: &filter_all
    filters:
      branches:
        only: /.*/
      tags:
        only: /.*/

  filter_head: &filter_head
    filters:
      branches:
        only: master
      tags:
        only: stg

  filter_release: &filter_release
    filters:
      branches:
        ignore: /.*/
      tags:
        only: /v[0-9]+\.[0-9]+\.[0-9]+(-[0-9])?/

general:
  artifacts:
    - coverage

jobs:
  test_node12:
    docker:
      - image: circleci/node:12
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
          - v4-node12-dependencies-{{ checksum "package.json" }}
      - run: npm install
      - save_cache:
          paths:
            - node_modules
          key: v4-node12-dependencies-{{ checksum "package.json" }}
      - run: npm test -- --maxWorkers=4
      - run: cat coverage/lcov.info | ./node_modules/coveralls/bin/coveralls.js || true

  test_node14:
    docker:
      - image: circleci/node:14
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
          - v4-node14-dependencies-{{ checksum "package.json" }}
      - run: npm install
      - save_cache:
          paths:
            - node_modules
          key: v4-node14-dependencies-{{ checksum "package.json" }}
      - run: npm test -- --maxWorkers=4

  # The dist build uses Vite, which needs a current Node (the tests above stay on
  # Node 12/14 until kiln's Jest 23 is upgraded). Builds the bundles and loads
  # them in jsdom the way sites do (scripts/smoke-test.js).
  build_node24:
    docker:
      - image: cimg/node:24.21
    working_directory: ~/repo
    steps:
      - checkout
      - run: npm ci
      - run: npm run build
      - run: npm run test:dist
      # builds are reproducible; compare with a local `md5 -q dist/*` to confirm
      # a published dist matches the one that was tested
      - run: md5sum dist/*

  deploy_docs:
    docker:
      - image: circleci/node:14
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          key: v4-website-dependencies-{{ checksum "website/package.json" }}
      - run:
          name: Build
          command: |
            sudo apt-get -y install awscli
            bash ./.circleci/scripts/deploy-docs.sh
      - save_cache:
          key: v4-website-dependencies-{{ checksum "website/package.json" }}
          paths:
            - website/node_modules

  deploy_package:
    docker:
      # prepublishOnly builds dist with Vite and smoke-tests it, so it needs Node 24
      - image: cimg/node:24.21
    working_directory: ~/repo
    steps:
      - checkout
      - run: npm ci
      - run: |
          echo "$NPMRC" > ~/.npmrc
          chmod 600 ~/.npmrc
          if [[ "$CIRCLE_TAG" = *-* ]]; then
            npm publish --tag=prerelease
          else
            npm publish
          fi

workflows:
  version: 2
  test:
    jobs:
      - test_node12:
          <<: *filter_all
      - test_node14:
          <<: *filter_all
      - deploy_docs:
          <<: *filter_head
          context:
            - Documentation
          requires:
            - test_node12
            - test_node14
      - build_node24:
          <<: *filter_all
      - deploy_package:
          <<: *filter_release
          context:
            - npm-publish
          requires:
            - test_node12
            - test_node14
            - build_node24
