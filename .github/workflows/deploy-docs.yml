name: Deploy docs

on:
  push:
    branches:
      - master
    tags:
      - stg

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    needs: []   # runs independently; add 'test' here if you want to gate on tests passing first

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build and deploy docs
        env:
          PROJECT_NAME: clay-kiln
          BUILD_DIR: website
        run: |
          BUCKET=docs.clayplatform.io

          echo "Building documentation..."
          cd "$BUILD_DIR"
          npm install --quiet
          npm run build

          echo "Uploading to s3://$BUCKET/$PROJECT_NAME/..."
          aws s3 sync --delete --acl=public-read "build/$PROJECT_NAME/" "s3://$BUCKET/$PROJECT_NAME/"

          echo "Documentation updated."
