name: Build and commit dist

# Safety net: runs after Test passes to catch any commit where the
# pre-commit hook was bypassed (e.g. git commit --no-verify).
# Normal workflow: pre-commit hook builds dist and stages it before
# every commit, so this job typically finds nothing to do.

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - '**'
      - '!master'

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build
        env:
          BABEL_ENV: build

      - name: Commit dist if missing or stale
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --staged --quiet; then
            echo "dist already up to date (pre-commit hook ran)"
          else
            echo "dist was stale — pre-commit hook was skipped, rebuilding"
            git commit -m "chore: rebuild dist [skip ci]"
            git push
          fi
